# Jenkins Configuration as Code: the whole server setup lives in Git.
# Values like ${NAME:-default} come from environment variables (see .env.example).
jenkins:
  systemMessage: "Task API CI/CD. Configured as code, do not edit settings in the UI."
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"
  sonarGlobalConfiguration:
    installations:
      - name: "sonarqube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "SonarQube analysis token"
              secret: "${SONAR_TOKEN:-not-set-yet}"
          - usernamePassword:
              scope: GLOBAL
              id: "registry-creds"
              description: "Container registry login (GitHub username + token with write:packages)"
              username: "${REGISTRY_USER:-not-set}"
              password: "${REGISTRY_PASSWORD:-not-set}"

jobs:
  - script: >
      pipelineJob('task-api') {
        description('Builds, tests, scans and deploys the Task API')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/mohd-21/jenkins-cicd-pipeline.git') }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
        triggers { scm('H/5 * * * *') }
      }
